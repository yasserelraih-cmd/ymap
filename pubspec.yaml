name: ymap
description: "YMAP - تطبيق خرائط وملاحة ذكي"
publish_to: 'none'
version: 0.11.0+12

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  intl: any
  shared_preferences: ^2.5.6
  maplibre_gl: ^0.28.0
  geolocator: ^14.1.2
  http: ^1.6.0
  url_launcher: ^6.3.3
  flutter_tts: ^4.2.5
  wakelock_plus: ^1.8.0
  share_plus: ^13.3.1
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
